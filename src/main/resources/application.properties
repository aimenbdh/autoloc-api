spring.application.name=autoloc-api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3307/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Atelier 5 : prefixe commun de l'API (http://localhost:8080/api/...)
server.servlet.context-path=/api

# Atelier 5 : palliatif provisoire pour les proxys LAZY d'Hibernate (disparaitra avec les DTO)
spring.jackson.serialization.fail-on-empty-beans=false
